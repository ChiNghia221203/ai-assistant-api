[project]
name = "ai-assistant"
version = "0.1.0"
description = "Hotel multi-source review API (Sài Gòn) with Supabase pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "supabase>=2.10.0",
    "pyjwt[crypto]>=2.10.0",
    "openai>=1.60.0",
    "google-genai>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "tiktoken>=0.13.0",
]
