name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: CI - Test Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Lấy source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python + cache pip tích hợp sẵn
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Cài dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Kiểm tra format/code quality (nên pin version ruff trong requirements-dev.txt)
      - name: Lint with Ruff
        run: |
          ruff check .

      # Chạy test
      - name: Run tests
        run: |
          pytest

  deploy:
    name: CD - Deploy Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Chỉ chạy khi CI thành công
    needs:
      - test
    # Chỉ deploy khi push main (không chạy khi PR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render deployment
        run: |
          curl -sSf "${{ secrets.RENDER_DEPLOY_HOOK }}"
