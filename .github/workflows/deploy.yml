run-name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ==================================================
  # CI
  # ==================================================

  test:
    name: CI - Test Application

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Python
      # -----------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # Install uv
      # -----------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # -----------------------------
      # Install dependencies
      # -----------------------------

      - name: Install dependencies
        run: |
          uv sync --locked

      # -----------------------------
      # Ruff lint
      # -----------------------------

      - name: Lint with Ruff
        run: |
          uv run ruff check .

      # -----------------------------
      # Ruff format
      # -----------------------------

      - name: Check formatting
        run: |
          uv run ruff format --check .

      # -----------------------------
      # Type check
      # -----------------------------

      - name: Type check
        run: |
          uv run pyright

      # -----------------------------
      # Tests
      # -----------------------------

      - name: Run tests
        run: |
          uv run pytest

  # ==================================================
  # CD
  # ==================================================

  deploy:
    name: CD - Deploy Render

    runs-on: ubuntu-latest

    timeout-minutes: 5

    needs:
      - test

    # Chỉ deploy khi push trực tiếp vào main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Trigger Render deployment
        run: |
          curl -sSf "${{ secrets.RENDER_DEPLOY_HOOK }}"
